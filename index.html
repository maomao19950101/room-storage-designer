<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>超精细高保真室内收纳 3D 交互设计空间 (1:1 实景级)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    body {
      overflow: hidden;
      background: #0b0d13;
      color: #f8fafc;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Floating Apple/Linear-Style Glassmorphism HUD */
    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px;
    }

    /* Top Header Bar */
    .header-bar {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 1120px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .header-info h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-info p {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 3px;
    }
    .tag-pill {
      font-size: 11px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* Controls Group */
    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn-tool {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-tool:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .btn-tool.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
    }

    /* Lighting Mode Switcher */
    .lighting-group {
      display: flex;
      background: rgba(0, 0, 0, 0.4);
      padding: 3px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .light-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .light-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Side Detail Drawer (Item Spec & Shopping Info) */
    .drawer-panel {
      pointer-events: auto;
      position: absolute;
      right: 24px;
      top: 96px;
      width: 360px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateX(400px);
      opacity: 0;
    }
    .drawer-panel.show {
      transform: translateX(0);
      opacity: 1;
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 14px;
    }
    .drawer-title {
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .drawer-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }
    .drawer-close:hover { color: #fff; }
    .drawer-row { margin-bottom: 12px; }
    .d-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin-bottom: 3px; }
    .d-val { font-size: 13px; color: #f1f5f9; line-height: 1.45; }
    .d-highlight { color: #34d399; font-weight: 700; font-size: 15px; }
    .d-code {
      display: inline-block;
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 12px;
      margin-top: 4px;
      border: 1px dashed rgba(59, 130, 246, 0.3);
    }
    .d-tip {
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12px;
      color: #6ee7b7;
      line-height: 1.4;
      margin-top: 14px;
    }

    /* 3D Dynamic Interactive Hotspots */
    .hotspot {
      position: absolute;
      z-index: 5;
      pointer-events: auto;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .hotspot:hover {
      transform: translate(-50%, -50%) scale(1.15);
    }
    .hotspot-card {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 2px solid #38bdf8;
      color: #ffffff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
      white-space: nowrap;
      animation: pulse-border 2.5s infinite;
    }
    @keyframes pulse-border {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.6); }
      70% { box-shadow: 0 0 0 8px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .camera-tabs {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 10px;
      border-radius: 14px;
      display: flex;
      gap: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .cam-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .cam-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .cam-btn.active {
      background: #3b82f6;
      border-color: #3b82f6;
      color: #fff;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }
    .help-pill {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>

  <!-- Offline Libraries with Fallback -->
  <script src="./libs/three.min.js"></script>
  <script src="./libs/OrbitControls.js"></script>
  <script src="./libs/tween.umd.js"></script>
  <script src="./libs/RoundedBoxGeometry.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- HUD Interface Layer -->
  <div class="hud-layer">
    <!-- Top Header -->
    <div class="header-bar">
      <div class="header-info">
        <h1>🏡 1:1 实景级高精度空间收纳设计 <span class="tag-pill">PBR 超写实渲染</span></h1>
        <p>国标建筑尺度 · 门窗床结构绝对锁死 · 圆角微倒角细节 · 真实柔和接触阴影</p>
      </div>

      <div class="header-controls">
        <!-- Lighting Presets -->
        <div class="lighting-group">
          <button id="l-sun" class="light-btn active" onclick="setLighting('sun')">☀️ 午后阳光</button>
          <button id="l-dusk" class="light-btn" onclick="setLighting('dusk')">🌆 暖光落日</button>
          <button id="l-night" class="light-btn" onclick="setLighting('night')">🌙 夜间专注</button>
        </div>

        <button id="btn-ruler" class="btn-tool active" onclick="toggleRulers()">📏 毫米级标尺</button>
        <button id="btn-xray" class="btn-tool" onclick="toggleXray()">🔍 收纳位透视</button>
      </div>
    </div>

    <!-- Side Detail Drawer -->
    <div id="drawer" class="drawer-panel">
      <div class="drawer-header">
        <div id="d-title" class="drawer-title">📦 收纳选品详情</div>
        <button class="drawer-close" onclick="closeDrawer()">✕</button>
      </div>
      <div class="drawer-row">
        <div class="d-label">物理安装位置 / 净空条件</div>
        <div id="d-loc" class="d-val">-</div>
      </div>
      <div class="drawer-row">
        <div class="d-label">容纳物品</div>
        <div id="d-items" class="d-val">-</div>
      </div>
      <div class="drawer-row">
        <div class="d-label">免打孔/微孔工法与防猫保护</div>
        <div id="d-solution" class="d-val">-</div>
      </div>
      <div class="drawer-row">
        <div class="d-label">精确尺寸与公差余量</div>
        <div id="d-specs" class="d-val" style="color: #60a5fa; font-weight:600;">-</div>
      </div>
      <div class="drawer-row" style="display:flex; justify-content:space-between; align-items:center;">
        <span class="d-label">参考单价</span>
        <span id="d-price" class="d-highlight">¥0</span>
      </div>
      <div class="drawer-row">
        <div class="d-label">电商搜索关键词</div>
        <div id="d-kw" class="d-code">-</div>
      </div>
      <div id="d-tip" class="d-tip">
        💡 租房与养猫铁律：尺寸比实测小 3~5cm，推拉绝不卡住！
      </div>
    </div>

    <!-- Bottom Camera Navigation -->
    <div class="bottom-bar">
      <div class="camera-tabs">
        <button class="cam-btn active" onclick="setCam('iso')">🌐 3D 轴测全景</button>
        <button class="cam-btn" onclick="setCam('racket')">🏸 球拍高位壁挂</button>
        <button class="cam-btn" onclick="setCam('bed')">🛏️ 床底抽拉扁箱</button>
        <button class="cam-btn" onclick="setCam('desk')">💻 书桌零食立放</button>
        <button class="cam-btn" onclick="setCam('cat')">🐱 猫咪餐饮与粮桶</button>
        <button class="cam-btn" onclick="setCam('top')">📐 顶视动线 (85cm)</button>
      </div>

      <div class="help-pill">
        🖱️ 鼠标左键旋转 · 滚轮缩放 · 右键平移 · 点击 3D 标签查看采购参数
      </div>
    </div>
  </div>

  <!-- 3D Hotspot Screen Projection Layer -->
  <div id="hotspot-layer"></div>

  <script>
    // --- 1. Procedural High-Res PBR Textures Generator ---
    // A. Tile Floor Texture with Grout Lines & Normal Map
    function createTileTextures() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Warm porcelain tile base
      ctx.fillStyle = '#dcd6cc';
      ctx.fillRect(0, 0, 1024, 1024);

      // Subtle marbling noise
      const imgData = ctx.getImageData(0, 0, 1024, 1024);
      for (let i = 0; i < imgData.data.length; i += 4) {
        const n = (Math.random() - 0.5) * 14;
        imgData.data[i] = Math.min(255, Math.max(0, imgData.data[i] + n));
        imgData.data[i+1] = Math.min(255, Math.max(0, imgData.data[i+1] + n));
        imgData.data[i+2] = Math.min(255, Math.max(0, imgData.data[i+2] + n));
      }
      ctx.putImageData(imgData, 0, 0);

      // Recessed grout lines (600mm x 600mm grid)
      ctx.strokeStyle = '#9f9585';
      ctx.lineWidth = 5;
      const step = 256;
      for (let i = 0; i <= 1024; i += step) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 1024); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(1024, i); ctx.stroke();
      }

      const diffTex = new THREE.CanvasTexture(canvas);
      diffTex.wrapS = THREE.RepeatWrapping;
      diffTex.wrapT = THREE.RepeatWrapping;
      diffTex.repeat.set(3, 4);

      return diffTex;
    }

    // B. Natural Wood Grain Texture (Tabletop & Bed Frame)
    function createWoodTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#b38b59';
      ctx.fillRect(0, 0, 512, 512);

      // Natural linear wood fibers
      for (let i = 0; i < 60; i++) {
        ctx.fillStyle = 'rgba(110, 75, 35, ' + (0.05 + Math.random() * 0.15) + ')';
        const y = Math.random() * 512;
        ctx.fillRect(0, y, 512, 2 + Math.random() * 8);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // C. Soft Contact Shadow Radial Gradient (Grounding Furniture)
    function createRadialShadowTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 256;
      const ctx = canvas.getContext('2d');
      const grad = ctx.createRadialGradient(128, 128, 10, 128, 128, 120);
      grad.addColorStop(0, 'rgba(0,0,0,0.7)');
      grad.addColorStop(0.3, 'rgba(0,0,0,0.35)');
      grad.addColorStop(0.7, 'rgba(0,0,0,0.08)');
      grad.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 256, 256);
      return new THREE.CanvasTexture(canvas);
    }

    // Helper: Create a Contact Shadow Plane
    const shadowTex = createRadialShadowTexture();
    function addContactShadow(parent, w, d, x, z, opacity = 0.85) {
      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(w, d),
        new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, opacity: opacity, depthWrite: false })
      );
      plane.rotation.x = -Math.PI / 2;
      plane.position.set(x, 0.003, z);
      parent.add(plane);
    }

    // --- 2. Three.js Scene, Camera, ACESFilmic Renderer ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0e1117);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(8.5, 9, 8.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.04;
    controls.minDistance = 2.5;
    controls.maxDistance = 22;
    controls.target.set(0, 1.1, 0);

    // --- 3. Lighting System (Sunlight, Ambient, Lamp, Slatted Blinds) ---
    const ambLight = new THREE.AmbientLight(0xfff7ed, 0.7);
    scene.add(ambLight);

    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.4);
    sunLight.position.set(-6, 8, 4.5);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 25;
    sunLight.shadow.camera.left = -5;
    sunLight.shadow.camera.right = 5;
    sunLight.shadow.camera.top = 5;
    sunLight.shadow.camera.bottom = -5;
    sunLight.shadow.bias = -0.0003;
    scene.add(sunLight);

    // Warm Bedside/Desk Ambient Light
    const deskPendantLight = new THREE.PointLight(0xffaa44, 0.9, 6);
    deskPendantLight.position.set(-1.1, 2.1, 0.2);
    deskPendantLight.castShadow = true;
    scene.add(deskPendantLight);

    // --- 4. Room Architectural Envelope (3.4m x 4.6m Strict Scale) ---
    const roomGroup = new THREE.Group();

    // 1) PBR Tile Floor
    const floorTileTex = createTileTextures();
    const floorMesh = new THREE.Mesh(
      new THREE.BoxGeometry(3.6, 0.2, 4.8),
      new THREE.MeshStandardMaterial({ map: floorTileTex, roughness: 0.35, metalness: 0.05 })
    );
    floorMesh.position.set(0, -0.1, 0);
    floorMesh.receiveShadow = true;
    roomGroup.add(floorMesh);

    // 2) Cutaway Interior Walls (Warm White Latex Paint)
    const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f3ee, roughness: 0.95 });
    
    // North Wall (Back)
    const northWall = new THREE.Mesh(new THREE.BoxGeometry(3.6, 2.8, 0.16), wallMat);
    northWall.position.set(0, 1.4, -2.48);
    northWall.receiveShadow = true;
    roomGroup.add(northWall);

    // East Wall (Right)
    const eastWall = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.8, 4.8), wallMat);
    eastWall.position.set(1.88, 1.4, 0);
    eastWall.receiveShadow = true;
    roomGroup.add(eastWall);

    // West Wall Segment (Left - Containing Door)
    const westWall = new THREE.Mesh(new THREE.BoxGeometry(0.16, 2.8, 2.2), wallMat);
    westWall.position.set(-1.88, 1.4, 1.3);
    westWall.receiveShadow = true;
    roomGroup.add(westWall);

    // 3) Architectural Skirting Board (踢脚线 - 10cm H x 1.5cm D)
    const skirtingMat = new THREE.MeshStandardMaterial({ color: 0x423832, roughness: 0.7 });
    const skirtN = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.1, 0.02), skirtingMat);
    skirtN.position.set(0, 0.05, -2.39);
    roomGroup.add(skirtN);
    const skirtE = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.1, 4.8), skirtingMat);
    skirtE.position.set(1.79, 0.05, 0);
    roomGroup.add(skirtE);
    const skirtW = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.1, 2.2), skirtingMat);
    skirtW.position.set(-1.79, 0.05, 1.3);
    roomGroup.add(skirtW);

    // 4) Architectural Door (GB/T 5824 90cm x 210cm) with Molded Panels & Brass Lever
    const doorGroup = new THREE.Group();
    // Door Architrave (门套线)
    const architrave = new THREE.Mesh(
      new THREE.BoxGeometry(0.12, 2.18, 1.04),
      new THREE.MeshStandardMaterial({ color: 0x3d322a })
    );
    architrave.position.set(0, 1.09, 0.45);
    doorGroup.add(architrave);

    // Door Leaf with Beveled Recessed Panels
    const doorLeaf = new THREE.Mesh(
      new THREE.RoundedBoxGeometry(0.05, 2.1, 0.9, 4, 0.01),
      new THREE.MeshStandardMaterial({ color: 0x5a4638, roughness: 0.6 })
    );
    doorLeaf.position.set(0, 1.05, 0.45);
    doorLeaf.castShadow = true;
    doorGroup.add(doorLeaf);

    // Brass Lever Handle & Escutcheon Plate
    const brassMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.85, roughness: 0.25 });
    const handlePlate = new THREE.Mesh(new THREE.BoxGeometry(0.01, 0.24, 0.06), brassMat);
    handlePlate.position.set(0.03, 1.0, 0.82);
    doorGroup.add(handlePlate);
    const handleLever = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.12), brassMat);
    handleLever.rotation.z = Math.PI / 2;
    handleLever.position.set(0.06, 1.02, 0.82);
    doorGroup.add(handleLever);

    doorGroup.position.set(-1.88, 0, -2.1);
    roomGroup.add(doorGroup);

    // 5) South Large Window with Sill & Venetian Blinds (Slatted Light Effect)
    const windowGroup = new THREE.Group();
    const windowFrame = new THREE.Mesh(
      new THREE.BoxGeometry(2.0, 2.2, 0.12),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.7, roughness: 0.3 })
    );
    windowFrame.position.set(0.7, 1.5, 2.48);
    windowGroup.add(windowFrame);

    // Polished Stone Window Sill (窗台石)
    const windowSill = new THREE.Mesh(
      new THREE.BoxGeometry(2.1, 0.04, 0.24),
      new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2 })
    );
    windowSill.position.set(0.7, 0.4, 2.42);
    windowGroup.add(windowSill);

    // Double Glazing Glass
    const windowGlass = new THREE.Mesh(
      new THREE.PlaneGeometry(1.85, 2.05),
      new THREE.MeshPhysicalMaterial({ color: 0x93c5fd, transmission: 0.92, opacity: 0.7, transparent: true })
    );
    windowGlass.position.set(0.7, 1.5, 2.45);
    windowGroup.add(windowGlass);

        v.project(camera);
        if (v.z > 1) { el.style.display = 'none'; return; }
        el.style.display = 'block';
        el.style.left = `${(v.x * 0.5 + 0.5) * window.innerWidth}px`;
        el.style.top = `${(-v.y * 0.5 + 0.5) * window.innerHeight}px`;
      });
    }

    // --- 9. UI Logic & Camera Navigation ---
    function openDrawer(data) {
      document.getElementById('d-title').innerText = `${data.icon} ${data.title}`;
      document.getElementById('d-loc').innerText = data.loc;
      document.getElementById('d-items').innerText = data.items;
      document.getElementById('d-solution').innerText = data.solution;
      document.getElementById('d-specs').innerText = data.specs;
      document.getElementById('d-price').innerText = data.price;
      document.getElementById('d-kw').innerText = data.kw;
      document.getElementById('d-tip').innerText = `💡 ${data.tip}`;
      document.getElementById('drawer').classList.add('show');
    }
    function closeDrawer() {
      document.getElementById('drawer').classList.remove('show');
    }

    function toggleRulers() {
      rulerGroup.visible = !rulerGroup.visible;
      document.getElementById('btn-ruler').classList.toggle('active');
    }

    let isXray = false;
    function toggleXray() {
      isXray = !isXray;
      document.getElementById('btn-xray').classList.toggle('active');

      furnitureGroup.traverse(child => {
        if (child.isMesh && child.material) {
          child.material.transparent = isXray;
          child.material.opacity = isXray ? 0.25 : 1.0;
        }
      });
    }

    // Lighting Mode Switches
    function setLighting(mode) {
      document.querySelectorAll('.light-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (mode === 'sun') {
        ambLight.color.setHex(0xfff7ed);
        ambLight.intensity = 0.7;
        sunLight.color.setHex(0xfff5e6);
        sunLight.intensity = 1.4;
        deskPendantLight.intensity = 0.6;
        scene.background.setHex(0x0e1117);
      } else if (mode === 'dusk') {
        ambLight.color.setHex(0xffd1a4);
        ambLight.intensity = 0.55;
        sunLight.color.setHex(0xff8833);
        sunLight.intensity = 1.8;
        deskPendantLight.intensity = 1.2;
        scene.background.setHex(0x1a120c);
      } else if (mode === 'night') {
        ambLight.color.setHex(0x1e293b);
        ambLight.intensity = 0.25;
        sunLight.intensity = 0.0;
        deskPendantLight.intensity = 2.2;
        scene.background.setHex(0x05070a);
      }
    }

    // Smooth Camera Tween
    function tweenCam(pos, target, dur = 1100) {
      new TWEEN.Tween(camera.position).to(pos, dur).easing(TWEEN.Easing.Cubic.Out).start();
      new TWEEN.Tween(controls.target).to(target, dur).easing(TWEEN.Easing.Cubic.Out).start();
    }

    function setCam(mode) {
      document.querySelectorAll('.camera-tabs button').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      if (mode === 'iso') {
        tweenCam({ x: 8.5, y: 9, z: 8.5 }, { x: 0, y: 1.1, z: 0 });
      } else if (mode === 'racket') {
        tweenCam({ x: -0.6, y: 2.1, z: -0.5 }, { x: -1.8, y: 1.6, z: -0.6 });
        openDrawer(hotspotsData[0]);
      } else if (mode === 'bed') {
        tweenCam({ x: 0.1, y: 1.2, z: 1.6 }, { x: 0.15, y: 0.2, z: -0.2 });
        openDrawer(hotspotsData[1]);
      } else if (mode === 'desk') {
        tweenCam({ x: -0.4, y: 1.6, z: 0.7 }, { x: -0.35, y: 0.9, z: -0.1 });
        openDrawer(hotspotsData[2]);
      } else if (mode === 'cat') {
        tweenCam({ x: -0.5, y: 1.2, z: -1.3 }, { x: -1.45, y: 0.3, z: -1.4 });
        openDrawer(hotspotsData[3]);
      } else if (mode === 'top') {
        tweenCam({ x: 0.01, y: 14, z: 0.01 }, { x: 0, y: 0, z: 0 });
      }
    }

    // Window Resize Handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Main Render Loop
    function animate() {
      requestAnimationFrame(animate);
      TWEEN.update();
      controls.update();
      updateHotspots();
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);

    // Initial Welcome Camera Drift
    camera.position.set(11, 11, 11);
    tweenCam({ x: 8.5, y: 9, z: 8.5 }, { x: 0, y: 1.1, z: 0 }, 1800);
  </script>
</body>
</html>
