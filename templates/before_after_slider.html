<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "PingFang SC", sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 24px; line-height: 1.5; }
    .container { max-width: 1180px; margin: 0 auto; }
    header { margin-bottom: 22px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 16px; }
    header h1 { font-size: 22px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
    header p { color: #94a3b8; font-size: 13.5px; margin-top: 6px; }
    .badge { font-size: 11.5px; background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); padding: 2px 10px; border-radius: 20px; }
    .tabs { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
    .tab-btn { background: rgba(255, 255, 255, 0.06); color: #cbd5e1; border: 1px solid rgba(255, 255, 255, 0.1); padding: 9px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .tab-btn:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
    .tab-btn.active { background: #2563eb; border-color: #3b82f6; color: #fff; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .slider-box { position: relative; width: 100%; max-width: 1100px; height: 640px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255, 255, 255, 0.15); user-select: none; background: #000; }
    .img-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .img-layer img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .img-before { z-index: 1; }
    .img-after { z-index: 2; width: 50%; overflow: hidden; border-right: 3px solid #38bdf8; }
    .img-after img { width: 1100px; max-width: none; }
    .slider-handle { position: absolute; left: 50%; width: 44px; height: 44px; margin-left: -22px; top: calc(50% - 22px); background: #2563eb; border: 3px solid #ffffff; border-radius: 50%; z-index: 10; cursor: ew-resize; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
    .tag-label { position: absolute; bottom: 18px; padding: 6px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 700; backdrop-filter: blur(8px); z-index: 5; }
    .tag-before { right: 18px; background: rgba(239, 68, 68, 0.85); color: white; }
    .tag-after { left: 18px; background: rgba(16, 185, 129, 0.85); color: white; }
    .blueprint-view img { width: 100%; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.15); }
    .iframe-3d { width: 100%; height: 680px; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; background: #090b10; }
    .shopping-section { margin-top: 28px; background: rgba(30, 41, 59, 0.65); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 22px; }
    .shopping-section h2 { font-size: 17px; margin-bottom: 14px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th, td { padding: 11px 13px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
    th { background: rgba(15, 23, 42, 0.8); color: #94a3b8; font-weight: 600; }
    .price { color: #34d399; font-weight: 700; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🏡 {{TITLE}} <span class="badge">零硬装改动 · 1:1 实景对齐</span></h1>
      <p>{{SUBTITLE}}</p>
    </header>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('slider', this)">🔄 实景改造前后对比 (Before & After)</button>
      <button class="tab-btn" onclick="switchTab('blueprint', this)">📐 原图点对点施工批注图</button>
      <button class="tab-btn" onclick="switchTab('3d', this)">🌐 1:1 交互 3D 空间仿真工作台</button>
    </div>
    <div id="tab-slider" class="tab-content active">
      <div class="slider-box" id="sliderBox">
        <div class="img-layer img-before">
          <img src="{{BEFORE_IMG}}" alt="改造前">
          <div class="tag-label tag-before">📦 改造前实景</div>
        </div>
        <div class="img-layer img-after" id="afterLayer">
          <img id="imgAfter" src="{{AFTER_IMG}}" alt="改造后">
          <div class="tag-label tag-after">✨ 收纳整理后效果</div>
        </div>
        <div class="slider-handle" id="sliderHandle">↔</div>
      </div>
    </div>
    <div id="tab-blueprint" class="tab-content">
      <div class="blueprint-view"><img src="{{BLUEPRINT_IMG}}" alt="点对点标注图"></div>
    </div>
    <div id="tab-3d" class="tab-content">
      <iframe class="iframe-3d" src="{{VIEWER_3D_URL}}"></iframe>
    </div>
    <div class="shopping-section">
      <h2>🛒 本方案精准采购清单 (BOM)</h2>
      <table>
        <thead>
          <tr><th>序号</th><th>位置</th><th>品名</th><th>工程尺寸规格</th><th>参考价</th><th>防宠/避坑要点</th></tr>
        </thead>
        <tbody>{{BOM_ROWS}}</tbody>
      </table>
    </div>
    {{XIANYU_SECTION}}
  </div>
  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');
    }
    const box = document.getElementById('sliderBox');
    const afterLayer = document.getElementById('afterLayer');
    const handle = document.getElementById('sliderHandle');
    const imgAfter = document.getElementById('imgAfter');
    function syncImgWidth() { if (box && imgAfter) imgAfter.style.width = box.offsetWidth + 'px'; }
    window.addEventListener('resize', syncImgWidth);
    syncImgWidth();
    let isDragging = false;
    function moveSlider(clientX) {
      const rect = box.getBoundingClientRect();
      const pct = Math.max(0, Math.min(100, ((clientX - rect.left) / rect.width) * 100));
      afterLayer.style.width = pct + '%';
      handle.style.left = pct + '%';
    }
    handle.addEventListener('pointerdown', () => isDragging = true);
    window.addEventListener('pointerup', () => isDragging = false);
    window.addEventListener('pointermove', (e) => { if (isDragging) moveSlider(e.clientX); });
  </script>
</body>
</html>
